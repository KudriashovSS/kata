<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tech-facts</title>
  <script>
    // До первой отрисовки: применить сохранённую тему, чтобы не мигало.
    (function () {
      try {
        var t = localStorage.getItem('techfacts-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* приватный режим — живём с system */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>
      </svg>
      <span class="brand-name" id="project-name">tech-facts</span>
      <span class="brand-skill">tech-facts</span>
    </div>
    <div class="stage-indicator" id="stage-indicator" data-stage="idle" hidden>
      <span class="dot" aria-hidden="true"></span>
      <span class="label" id="stage-label"></span>
    </div>
    <div class="header-spacer"></div>
    <span class="header-meta" id="header-meta"></span>
    <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">
      <span class="ticon" id="theme-icon" aria-hidden="true"></span>
      <span class="label" id="theme-label"></span>
    </button>
  </header>
  <div class="memory-strip" id="memory-strip" hidden></div>
  <div class="app-shell">
    <aside class="app-nav" id="app-nav" aria-label="Разделы"></aside>
    <main id="app" aria-live="polite"></main>
  </div>
  <div id="overlay-root"></div>
  <script src="./vendor/mermaid.min.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
