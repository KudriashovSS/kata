<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tech-facts · выбор срезов</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3a;
    --text: #e7eaf0; --muted: #8b93a3; --accent: #6ea8fe; --accent-dim: #2b4a7a;
    --ok: #4cc38a; --warn: #e5c07b; --hot: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 20px 120px; background: var(--bg); color: var(--text);
    font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(390px, 1fr)); gap: 14px; }
  .card {
    position: relative; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px 16px 14px; cursor: pointer; transition: border-color .15s, background .15s;
  }
  .card:hover { border-color: #3a4150; }
  .card.on { border-color: var(--accent); background: var(--panel-2); }
  .card input { position: absolute; opacity: 0; pointer-events: none; }
  .head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .tick {
    width: 18px; height: 18px; border-radius: 5px; border: 1.5px solid var(--muted);
    flex: none; display: grid; place-items: center; font-size: 12px; color: transparent;
  }
  .card.on .tick { background: var(--accent); border-color: var(--accent); color: #0f1115; }
  .name { font-weight: 600; }
  .cost { margin-left: auto; font-size: 11px; letter-spacing: .5px; padding: 2px 8px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .cost.S { color: var(--ok); border-color: var(--ok); }
  .cost.M { color: var(--warn); border-color: var(--warn); }
  .cost.L { color: var(--hot); border-color: var(--hot); }
  .desc { color: var(--muted); font-size: 13.5px; margin: 0 0 8px; }
  .found { font-size: 12.5px; color: var(--accent); background: rgba(110,168,254,.08); border-radius: 6px; padding: 4px 8px; display: inline-block; }
  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; background: rgba(15,17,21,.92);
    border-top: 1px solid var(--border); backdrop-filter: blur(6px);
  }
  .bar-in { max-width: 880px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; gap: 16px; }
  .count { color: var(--muted); font-size: 14px; }
  button {
    margin-left: auto; background: var(--accent); color: #0f1115; border: 0; border-radius: 9px;
    padding: 10px 22px; font: 600 15px inherit; cursor: pointer;
  }
  button:disabled { background: var(--accent-dim); color: #9fb4d8; cursor: default; }
  pre {
    display: none; margin: 26px 0 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 16px; font-size: 13px; overflow-x: auto; color: var(--ok);
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Какие технические факты извлекаем?</h1>
  <p class="sub">Агент нашёл в проекте эти срезы. Отметь нужные — можно один, можно все.
    Стоимость: <b style="color:var(--ok)">S</b> — часы, <b style="color:var(--warn)">M</b> — полдня, <b style="color:var(--hot)">L</b> — день+.</p>
  <div class="grid" id="grid"></div>
  <pre id="out"></pre>
</div>
<div class="bar"><div class="bar-in">
  <span class="count" id="count">Ничего не выбрано</span>
  <button id="go" disabled>Собрать выбранные факты</button>
</div></div>

<script>
/* Агент при генерации страницы заменяет FACTS на срезы, реально найденные в разведке,
   с живыми примерами в поле found. Ниже — демонстрационные данные. */
const FACTS = [
  { id: "event-graph", name: "Граф событий", cost: "S",
    desc: "Кто продюсит какие события и кто их консюмит. Страхует от «забыл уведомить консюмера».",
    found: "нашёл 14 событий и 3 консюмера в internal/events/" },
  { id: "module-graph", name: "Модули и зависимости", cost: "S",
    desc: "Крупные модули и направленные зависимости — каркас для остальных срезов.",
    found: "нашёл 9 модулей, 1 подозрение на цикл" },
  { id: "data-ownership", name: "Владение данными", cost: "M",
    desc: "Какие таблицы каким модулем владеются, кто лезет в чужие напрямую.",
    found: "нашёл 21 таблицу в migrations/, 2 прямых чужих доступа" },
  { id: "api-contracts", name: "Контракты API", cost: "M",
    desc: "HTTP/gRPC endpoints, назначение и известные потребители.",
    found: "нашёл 34 endpoint-а в api/" },
  { id: "external-integrations", name: "Внешние интеграции", cost: "S",
    desc: "Платёжки, нотификации, CRM: направление и точка интеграции в коде.",
    found: "нашёл Stripe, Sendgrid, amoCRM" },
  { id: "invariants", name: "Инварианты и ограничения", cost: "L",
    desc: "Бизнес-правила, зашитые в код и тесты. Самый ценный и самый дорогой срез.",
    found: "нашёл 40+ guard-ов и 120 тестов-кандидатов" },
  { id: "config-flags", name: "Конфиги и фичефлаги", cost: "S",
    desc: "Флаги, меняющие поведение, и где по ним ветвится код.",
    found: "нашёл 7 флагов в config/features.yaml" },
  { id: "gotchas", name: "Грабли и workarounds", cost: "M",
    desc: "Флакающие тесты, «не трогай — так надо», причины ревертов из git log.",
    found: "нашёл 12 HACK/FIXME и 4 revert-коммита" },
];

const grid = document.getElementById("grid");
for (const f of FACTS) {
  const card = document.createElement("label");
  card.className = "card";
  card.innerHTML = `
    <input type="checkbox" value="${f.id}">
    <div class="head"><span class="tick">✓</span><span class="name">${f.name}</span>
      <span class="cost ${f.cost}">${f.cost}</span></div>
    <p class="desc">${f.desc}</p>
    <span class="found">${f.found}</span>`;
  card.querySelector("input").addEventListener("change", (e) => {
    card.classList.toggle("on", e.target.checked); refresh();
  });
  grid.appendChild(card);
}

const count = document.getElementById("count"), go = document.getElementById("go"), out = document.getElementById("out");
const picked = () => [...grid.querySelectorAll("input:checked")].map(i => i.value);
function refresh() {
  const n = picked().length;
  count.textContent = n ? `Выбрано срезов: ${n}` : "Ничего не выбрано";
  go.disabled = !n;
}
go.addEventListener("click", () => {
  const config = { skill: "tech-facts", selected: picked() };
  out.textContent = JSON.stringify(config, null, 2);
  out.style.display = "block";
  navigator.clipboard?.writeText(JSON.stringify(config));
  go.textContent = "Конфиг скопирован — верни его агенту";
  out.scrollIntoView({ behavior: "smooth" });
});
</script>
</body>
</html>
