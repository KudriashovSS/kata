<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tech-facts · обозреватель фактов</title>
<script type="module">
  /* Диаграммы рендерятся mermaid-ом с CDN; без сети страница честно показывает исходник. */
  try {
    const m = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
    m.default.initialize({ startOnLoad: false, theme: "dark" });
    window.mermaid = m.default;
    window.dispatchEvent(new Event("mermaid-ready"));
  } catch { /* offline — fallback на <pre> */ }
</script>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel-2: #1d212b; --border: #2a2f3a;
    --text: #e7eaf0; --muted: #8b93a3; --accent: #6ea8fe;
    --ok: #4cc38a; --warn: #e5c07b; --hot: #e06c75;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif; }
  .layout { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
  /* ── сайдбар ── */
  aside { border-right: 1px solid var(--border); padding: 24px 14px; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
  aside h1 { font-size: 16px; margin: 0 4px 16px; }
  .slice { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
           background: none; border: 0; color: var(--muted); font: inherit; padding: 8px 10px;
           border-radius: 8px; cursor: pointer; }
  .slice:hover { background: var(--panel); }
  .slice.on { background: var(--panel-2); color: var(--text); }
  .slice .n { margin-left: auto; font-size: 12px; color: var(--muted); }
  .sep { margin: 14px 4px 6px; font-size: 11px; letter-spacing: 1px; color: var(--muted); text-transform: uppercase; }
  /* ── контент ── */
  main { padding: 28px 32px 120px; max-width: 980px; }
  .diagram { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
             padding: 18px; margin-bottom: 22px; overflow-x: auto; }
  .diagram pre { margin: 0; color: var(--muted); font-size: 13px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          padding: 16px 18px; margin-bottom: 12px; }
  .card.approved { border-color: var(--ok); }
  .card.rejected { border-color: var(--hot); opacity: .75; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 9px; border-radius: 20px; border: 1px solid var(--border); color: var(--muted); }
  .chip.type { color: var(--accent); border-color: var(--accent); }
  .conf { width: 8px; height: 8px; border-radius: 50%; }
  .conf.high { background: var(--ok); } .conf.medium { background: var(--warn); } .conf.low { background: var(--hot); }
  .statement { margin: 10px 0 8px; font-size: 15.5px; }
  .evidence { display: flex; gap: 8px; flex-wrap: wrap; }
  .ev { font-size: 12.5px; font-family: ui-monospace, monospace; color: var(--accent);
        background: rgba(110,168,254,.08); padding: 3px 8px; border-radius: 6px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .btn { background: var(--panel-2); border: 1px solid var(--border); color: var(--text);
         font: 13px inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  .btn:hover { border-color: #3a4150; }
  .btn.ok.on { background: var(--ok); border-color: var(--ok); color: #0f1115; font-weight: 600; }
  .btn.no.on { background: var(--hot); border-color: var(--hot); color: #0f1115; font-weight: 600; }
  textarea { display: none; width: 100%; margin-top: 10px; background: var(--panel-2);
             border: 1px solid var(--border); border-radius: 8px; color: var(--text);
             font: 14px inherit; padding: 10px; resize: vertical; min-height: 60px; }
  textarea.open { display: block; }
  /* ── экспорт-бар ── */
  .bar { position: fixed; left: 240px; right: 0; bottom: 0; background: rgba(15,17,21,.92);
         border-top: 1px solid var(--border); backdrop-filter: blur(6px); }
  .bar-in { max-width: 980px; padding: 14px 32px; display: flex; align-items: center; gap: 18px; }
  .stat { color: var(--muted); font-size: 13.5px; }
  .stat b.a { color: var(--ok); } .stat b.r { color: var(--hot); } .stat b.c { color: var(--warn); }
  .export { margin-left: auto; background: var(--accent); color: #0f1115; border: 0;
            border-radius: 9px; padding: 10px 22px; font: 600 15px inherit; cursor: pointer; }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <h1>tech-facts</h1>
    <div class="sep">Срезы</div>
    <div id="slices"></div>
  </aside>
  <main>
    <div class="diagram" id="diagram"></div>
    <div id="cards"></div>
  </main>
</div>
<div class="bar"><div class="bar-in">
  <span class="stat" id="stat"></span>
  <button class="export" id="export">Экспортировать ревью</button>
</div></div>

<script>
/* Агент при генерации страницы заменяет DATA на реально извлечённые срезы, факты и
   mermaid-исходники диаграмм. Ниже — демонстрационные данные. */
const DATA = {
  slices: [
    { id: "event-graph", name: "Граф событий",
      diagram: "flowchart LR\n  Orders -- produces --> E([order.created])\n  E --> Billing\n  E --> Notifications\n  E --> Analytics" },
    { id: "gotchas", name: "Грабли", diagram: null },
  ],
  facts: [
    { id: "fact:0001", type: "event-graph", confidence: "high", status: "candidate",
      statement: "Orders публикует order.created при успешном создании заказа",
      evidence: ["internal/orders/service.go:87", "commit abc1234"] },
    { id: "fact:0002", type: "event-graph", confidence: "medium", status: "candidate",
      statement: "Analytics консюмит order.created, но обработчик выглядит отключённым (закомментирован роутинг)",
      evidence: ["internal/analytics/consumer.go:12"] },
    { id: "fact:0003", type: "gotchas", confidence: "high", status: "candidate",
      statement: "Тесты billing_integration флакают на CI из-за таймаута Stripe-мока",
      evidence: ["billing/stripe_mock.go:44", "revert commit def5678"] },
  ],
};

const review = {};  // factId -> { decision: "approve"|"reject"|null, comment: "" }
DATA.facts.forEach(f => review[f.id] = { decision: null, comment: "" });

let current = DATA.slices[0].id;
const slicesEl = document.getElementById("slices"), cardsEl = document.getElementById("cards"),
      diagramEl = document.getElementById("diagram"), statEl = document.getElementById("stat");

function renderSlices() {
  slicesEl.innerHTML = "";
  for (const s of DATA.slices) {
    const b = document.createElement("button");
    b.className = "slice" + (s.id === current ? " on" : "");
    b.innerHTML = `<span>${s.name}</span><span class="n">${DATA.facts.filter(f => f.type === s.id).length}</span>`;
    b.onclick = () => { current = s.id; render(); };
    slicesEl.appendChild(b);
  }
}

async function renderDiagram() {
  const s = DATA.slices.find(x => x.id === current);
  if (!s.diagram) { diagramEl.style.display = "none"; return; }
  diagramEl.style.display = "block";
  if (window.mermaid) {
    const { svg } = await window.mermaid.render("d" + Date.now(), s.diagram);
    diagramEl.innerHTML = svg;
  } else {
    diagramEl.innerHTML = `<pre>${s.diagram}</pre>`;
  }
}
window.addEventListener("mermaid-ready", renderDiagram);

function renderCards() {
  cardsEl.innerHTML = "";
  for (const f of DATA.facts.filter(f => f.type === current)) {
    const r = review[f.id];
    const card = document.createElement("div");
    card.className = "card" + (r.decision === "approve" ? " approved" : r.decision === "reject" ? " rejected" : "");
    card.innerHTML = `
      <div class="row">
        <span class="conf ${f.confidence}" title="confidence: ${f.confidence}"></span>
        <span class="chip type">${f.type}</span>
        <span class="chip">${f.status}</span>
        <span class="chip" style="margin-left:auto">${f.id}</span>
      </div>
      <p class="statement">${f.statement}</p>
      <div class="evidence">${f.evidence.map(e => `<span class="ev">${e}</span>`).join("")}</div>
      <div class="actions">
        <button class="btn ok ${r.decision === "approve" ? "on" : ""}">✓ Принять</button>
        <button class="btn no ${r.decision === "reject" ? "on" : ""}">✗ Отклонить</button>
        <button class="btn cm">💬 Комментарий</button>
      </div>
      <textarea placeholder="Заметка для агента: уточнение, исправление формулировки, контекст…"
        class="${r.comment ? "open" : ""}">${r.comment}</textarea>`;
    const [ok, no, cm] = card.querySelectorAll(".btn");
    const ta = card.querySelector("textarea");
    ok.onclick = () => { r.decision = r.decision === "approve" ? null : "approve"; render(); };
    no.onclick = () => { r.decision = r.decision === "reject" ? null : "reject"; render(); };
    cm.onclick = () => ta.classList.toggle("open");
    ta.oninput = () => { r.comment = ta.value; renderStat(); };
    cardsEl.appendChild(card);
  }
}

function renderStat() {
  const vals = Object.values(review);
  const a = vals.filter(r => r.decision === "approve").length,
        rj = vals.filter(r => r.decision === "reject").length,
        c = vals.filter(r => r.comment.trim()).length;
  statEl.innerHTML = `Фактов: ${DATA.facts.length} · <b class="a">✓ ${a}</b> · <b class="r">✗ ${rj}</b> · <b class="c">💬 ${c}</b>`;
}

function render() { renderSlices(); renderDiagram(); renderCards(); renderStat(); }
render();

document.getElementById("export").onclick = (e) => {
  const payload = { skill: "tech-facts", review: {} };
  for (const [id, r] of Object.entries(review))
    if (r.decision || r.comment.trim())
      payload.review[id] = { decision: r.decision, comment: r.comment.trim() || undefined };
  navigator.clipboard?.writeText(JSON.stringify(payload, null, 2));
  e.target.textContent = "Ревью скопировано — верни его агенту";
};
</script>
</body>
</html>
